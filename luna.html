<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberSlots X - Advanced Casino</title>
    <style>
        :root {
            --neon-cyan: #00ffcc;
            --neon-pink: #ff007f;
            --neon-purple: #9d00ff;
            --bg-dark: #05070d;
            --panel-bg: rgba(18, 20, 32, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 50%, #1a1c2e 0%, #05070d 100%),
                linear-gradient(rgba(0, 255, 204, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 204, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .casino-container {
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.25), inset 0 0 15px rgba(0, 255, 204, 0.1);
            border-radius: 20px;
            padding: 35px;
            text-align: center;
            max-width: 480px;
            width: 100%;
            position: relative;
        }

        .casino-container::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, var(--neon-cyan), transparent, var(--neon-pink));
            border-radius: 20px;
            z-index: -1;
            filter: blur(5px);
            opacity: 0.7;
        }

        h1 {
            color: var(--neon-cyan);
            font-size: 2.2rem;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.8), 0 0 20px rgba(0, 255, 204, 0.4);
            letter-spacing: 4px;
        }

        .subtitle {
            font-size: 0.75rem;
            color: var(--neon-pink);
            letter-spacing: 3px;
            margin-bottom: 20px;
            text-shadow: 0 0 5px rgba(255, 0, 127, 0.6);
        }

        .balance-board {
            background: rgba(10, 12, 18, 0.9);
            border: 1px solid var(--neon-pink);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 1.1rem;
            color: var(--neon-pink);
            text-shadow: 0 0 8px rgba(255, 0, 127, 0.6);
            box-shadow: inset 0 0 10px rgba(255, 0, 127, 0.2);
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .slots-window {
            display: flex;
            justify-content: center;
            gap: 15px;
            background: #020305;
            border: 2px solid #2a2e43;
            border-radius: 15px;
            padding: 25px 15px;
            margin-bottom: 25px;
            box-shadow: inset 0 0 20px #000;
        }

        .reel {
            background: linear-gradient(180deg, #0d111a 0%, #161b28 50%, #0d111a 100%);
            border: 2px solid var(--neon-cyan);
            border-radius: 10px;
            width: 85px;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2), inset 0 0 15px rgba(0, 0, 0, 0.8);
            position: relative;
            overflow: hidden;
        }

        .reel.spinning {
            animation: shake 0.1s infinite;
            filter: blur(1.5px);
            border-color: var(--neon-pink);
        }

        @keyframes shake {
            0% { transform: translateY(2px); }
            50% { transform: translateY(-2px); }
            100% { transform: translateY(2px); }
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .bet-control {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(18, 20, 32, 0.9);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #333;
        }

        .bet-control label {
            font-size: 0.85rem;
            color: #aaa;
            letter-spacing: 1px;
        }

        .bet-control input {
            background: #05070d;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 6px;
            width: 80px;
            text-align: center;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            outline: none;
        }

        .spin-btn {
            background: linear-gradient(135deg, var(--neon-pink) 0%, var(--neon-purple) 100%);
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.5);
            transition: all 0.2s ease;
        }

        .spin-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #ff3399 0%, #b8005b 100%);
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.9);
            transform: translateY(-2px);
        }

        .spin-btn:disabled {
            background: #222;
            color: #555;
            cursor: not-allowed;
            box-shadow: none;
            border: 1px solid #333;
        }

        .message {
            margin-top: 20px;
            font-size: 1rem;
            min-height: 28px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .win {
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.8);
            animation: pulse 0.5s ease infinite alternate;
        }

        .lose {
            color: #ff4444;
            text-shadow: 0 0 8px rgba(255, 68, 68, 0.5);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        .audio-toggle {
            margin-top: 15px;
            background: transparent;
            border: 1px solid #444;
            color: #888;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .audio-toggle.active {
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            box-shadow: 0 0 5px rgba(0, 255, 204, 0.3);
        }
    </style>
</head>
<body>

    <div class="casino-container">
        <h1>CYBER SLOTS X</h1>
        <div class="subtitle">// QUANTUM ENGINE v3.0 //</div>
        
        <div class="balance-board">
            <span>CRÉDITOS: <strong id="balance">1000</strong> 🪙</span>
            <span>JACKPOT: <strong id="jackpotVal">5000</strong> 💎</span>
        </div>

        <div class="slots-window">
            <div class="reel" id="reel1">⚡</div>
            <div class="reel" id="reel2">🔥</div>
            <div class="reel" id="reel3">💎</div>
        </div>

        <div class="controls">
            <div class="bet-control">
                <label for="betInput">APUESTA:</label>
                <input type="number" id="betInput" value="20" min="10" max="1000">
            </div>
            <button class="spin-btn" id="spinBtn" onclick="iniciarJuego()">¡GIRAR SISTEMA!</button>
        </div>

        <button class="audio-toggle" id="audioToggle" onclick="toggleAudio()">🔊 ACTIVAR SONIDO / BGM</button>
        <div class="message" id="message">Sistemas listos. Ingrese apuesta.</div>
    </div>

    <script>
        const simbolos = ['⚡', '🔥', '💎', '🚀', '7️⃣', '🌐'];
        let balance = 1000;
        let audioCtx = null;
        let isAudioEnabled = false;
        let bgmInterval = null;

        // Inicializar contexto de audio por interacción web
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function toggleAudio() {
            initAudio();
            isAudioEnabled = !isAudioEnabled;
            const btn = document.getElementById('audioToggle');
            if (isAudioEnabled) {
                btn.classList.add('active');
                btn.textContent = "🔊 SONIDO ACTIVADO (BGM ON)";
                startBGM();
            } else {
                btn.classList.remove('active');
                btn.textContent = "🔇 ACTIVAR SONIDO / BGM";
                stopBGM();
            }
        }

        // Sintetizador de efectos de sonido (SFX) por Web Audio API
        function playTone(freq, type, duration, delay = 0) {
            if (!isAudioEnabled || !audioCtx) return;
            setTimeout(() => {
                try {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + duration);
                } catch(e) {}
            }, delay);
        }

        function soundSpinTick() {
            playTone(300 + Math.random() * 200, 'square', 0.05);
        }

        function soundWin() {
            if (!isAudioEnabled) return;
            playTone(523.25, 'sine', 0.15, 0);   // Do
            playTone(659.25, 'sine', 0.15, 150); // Mi
            playTone(783.99, 'sine', 0.15, 300); // Sol
            playTone(1046.50, 'sine', 0.4, 450); // Do alto
        }

        function soundJackpot() {
            if (!isAudioEnabled) return;
            let notes = [440, 554, 659, 880, 987, 1318];
            notes.forEach((note, index) => {
                playTone(note, 'sawtooth', 0.2, index * 100);
            });
        }

        // Música de fondo cibernética automatizada (BGM)
        function startBGM() {
            if (bgmiInterval) return;
            let bassNotes = [110, 123.47, 130.81, 98.00];
            let step = 0;
            bgmInterval = setInterval(() => {
                if (!isAudioEnabled || !audioCtx) return;
                try {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(bassNotes[step % bassNotes.length], audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.3);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.3);
                    step++;
                } catch(e) {}
            }, 300);
        }

        function stopBGM() {
            if (bgmInterval) {
                clearInterval(bgmInterval);
                bgmInterval = null;
            }
        }

        // Lógica del juego de Tragamonedas
        function iniciarJuego() {
            initAudio();
            const betInput = document.getElementById('betInput');
            const apuesta = parseInt(betInput.value);
            const balanceElem = document.getElementById('balance');
            const messageElem = document.getElementById('message');
            const spinBtn = document.getElementById('spinBtn');
            const r1 = document.getElementById('reel1');
            const r2 = document.getElementById('reel2');
            const r3 = document.getElementById('reel3');

            if (isNaN(apuesta) || apuesta <= 0) {
                messageElem.textContent = "¡ERROR: Apuesta inválida!";
                messageElem.className = "message lose";
                return;
            }

            if (apuesta > balance) {
                messageElem.textContent = "¡ERROR: Fondos insuficientes!";
                messageElem.className = "message lose";
                return;
            }

            balance -= apuesta;
            balanceElem.textContent = balance;
            spinBtn.disabled = true;
            messageElem.textContent = "PROCESANDO APUESTA EN RED NEURONAL...";
            messageElem.className = "message";

            r1.classList.add('spinning');
            r2.classList.add('spinning');
            r3.classList.add('spinning');

            let loops = 0;
            let maxLoops = 25;

            let spinTimer = setInterval(() => {
                r1.textContent = simbolos[Math.floor(Math.random() * simbolos.length)];
                r2.textContent = simbolos[Math.floor(Math.random() * simbolos.length)];
                r3.textContent = simbolos[Math.floor(Math.random() * simbolos.length)];
                soundSpinTick();
                loops++;

                if (loops > maxLoops) {
                    clearInterval(spinTimer);

                    r1.classList.remove('spinning');
                    r2.classList.remove('spinning');
                    r3.classList.remove('spinning');

                    const final1 = simbolos[Math.floor(Math.random() * simbolos.length)];
                    const final2 = simbolos[Math.floor(Math.random() * simbolos.length)];
                    const final3 = simbolos[Math.floor(Math.random() * simbolos.length)];

                    r1.textContent = final1;
                    r2.textContent = final2;
                    r3.textContent = final3;

                    if (final1 === '7️⃣' && final2 === '7️⃣' && final3 === '7️⃣') {
                        let premio = apuesta * 50;
                        balance += premio;
                        messageElem.textContent = `⚡ ¡MEGA JACKPOT QUÁNTICO! +${premio} 🪙 ⚡`;
                        messageElem.className = "message win";
                        soundJackpot();
                    } else if (final1 === final2 && final2 === final3) {
                        let premio = apuesta * 15;
                        balance += premio;
                        messageElem.textContent = `🔥 ¡TRIPLE COMBINACIÓN! +${premio} 🪙 🔥`;
                        messageElem.className = "message win";
                        soundWin();
                    } else if (final1 === final2 || final2 === final3 || final1 === final3) {
                        let premio = apuesta * 3;
                        balance += premio;
                        messageElem.textContent = `✨ ¡DOBLE CONEXIÓN! +${premio} 🪙 ✨`;
                        messageElem.className = "message win";
                        soundWin();
                    } else {
                        messageElem.textContent = "CONEXIÓN PERDIDA. Intente nuevamente.";
                        messageElem.className = "message lose";
                    }

                    balanceElem.textContent = balance;
                    spinBtn.disabled = false;

                    if (balance <= 0) {
                        messageElem.textContent = "¡SISTEMA BLOQUEADO: Sin créditos!";
                        spinBtn.disabled = true;
                    }
                }
            }, 70);
        }
    </script>
</body>
</html>
